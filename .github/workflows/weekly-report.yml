# ─────────────────────────────────────────────────────────────────────────────
# GitHub Action: Descarga semanal + Generación automática de PDF
# Flota Santa Marta — Tracklink Chile
#
# Corre cada lunes a la 01:00 CLT (05:00 UTC).
# Se corre con margen después de medianoche (y no el domingo 23:30 CLT como
# antes) para dar tiempo a que TrackGTS termine de asentar los datos de los
# últimos minutos del domingo: su healthcheck/actualización de base de datos
# tiene un ciclo de ~20 min, así que pedir el reporte justo al cierre de la
# semana podía dejar fuera los últimos excesos de velocidad del domingo.
# Flujo completo:
#   1. Descarga datos TrackGTS para Lun–Dom de la semana anterior
#   2. Fusiona con historial (merge_history.py)
#   3. Genera el PDF del reporte
#   4. Hace commit de Excel + PDF al repo
#
# Secrets requeridos (Settings → Secrets → Actions):
#   TL_USER     → usuario TrackGTS
#   TL_PASSWORD → contraseña TrackGTS
#   TL_DOMAIN   → subdominio (la parte antes de .trackgts.com)
# ─────────────────────────────────────────────────────────────────────────────

name: Descarga y Reporte Semanal

on:
  schedule:
    # 05:00 UTC = 01:00 CLT (UTC-4) cada lunes
    - cron: '0 5 * * 1'

  # Ejecución manual desde GitHub Actions (útil para pruebas)
  workflow_dispatch:
    inputs:
      override_start:
        description: 'Fecha inicio YYYY-MM-DD (opcional)'
        required: false
      override_end:
        description: 'Fecha fin YYYY-MM-DD (opcional)'
        required: false

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repositorio
        uses: actions/checkout@v4

      # ── Calcular rango Lun–Dom de la semana anterior ─────────────────────
      - name: Calcular rango de fechas
        id: dates
        run: |
          python3 << 'EOF'
          import os
          from datetime import datetime, timedelta

          start_override = os.environ.get('INPUT_OVERRIDE_START', '').strip()
          end_override   = os.environ.get('INPUT_OVERRIDE_END',   '').strip()

          if start_override and end_override:
              start_str = start_override
              end_str   = end_override
          else:
              today = datetime.utcnow().date()
              # Domingo más reciente (hoy inclusive si es domingo: weekday=6 → 0 días atrás)
              # Lunes=0 → 1 día atrás, Martes=1 → 2, ..., Domingo=6 → 0
              days_to_sunday = (today.weekday() + 1) % 7
              last_sunday    = today - timedelta(days=days_to_sunday)
              last_monday    = last_sunday - timedelta(days=6)
              start_str      = last_monday.strftime('%Y-%m-%d')
              end_str        = last_sunday.strftime('%Y-%m-%d')

          # Ventana de descarga a TrackGTS.
          #
          # 1) Offset +4h confirmado inspeccionando la petición real que hace
          #    el propio portal de TrackGTS (Network tab): para pedir el rango
          #    local 13/07 00:00 -> 19/07 23:59 (CLT), el portal envía
          #    startDate="2026/07/13 04:00:00" y endDate="2026/07/20 03:59:59"
          #    (día siguiente). TrackGTS guarda/filtra en UTC y solo usa
          #    userTimeZone para mostrar "Fecha de Inicio" en hora local; nuestro
          #    script mandaba las fechas literales sin este ajuste, lo que
          #    recortaba ~4h al inicio y al final de cada semana pedida.
          # 2) Se piden DOS ventanas de 7 días cada una (semana objetivo + semana
          #    previa) en vez de una sola de 14 días. Ni download.js ni
          #    bulk_download.js piden nunca más de 7 días por llamada, y el
          #    propio portal tampoco — el endpoint se llama
          #    "GetSpeedingReportByUnitsPagesZip" y no descartamos que exista
          #    un límite de páginas/filas por consulta que una ventana de 14
          #    días alcance a tocar. merge_history.py dedupea por
          #    Alias+Fecha de Inicio, así que la semana previa se vuelve a
          #    traer como red de seguridad: si algún registro llegó tarde a
          #    TrackGTS (telemetría GPS rezagada), esta corrida lo capta y el
          #    histórico se autocorrige.
          # REPORT_START/REPORT_END (para el PDF) siguen acotados a la semana
          # objetivo — estos ajustes son solo para la descarga a TrackGTS.
          cur_start        = datetime.strptime(start_str, '%Y-%m-%d').date()
          cur_end_plus1    = datetime.strptime(end_str, '%Y-%m-%d').date() + timedelta(days=1)
          prev_start       = cur_start - timedelta(days=7)

          tl_start      = f"{cur_start.strftime('%Y/%m/%d')} 04:00:00"
          tl_end        = f"{cur_end_plus1.strftime('%Y/%m/%d')} 03:59:59"
          tl_start_prev = f"{prev_start.strftime('%Y/%m/%d')} 04:00:00"
          tl_end_prev   = f"{cur_start.strftime('%Y/%m/%d')} 03:59:59"

          print(f"Rango PDF: {start_str} → {end_str}")
          print(f"Ventana TrackGTS (semana objetivo): {tl_start} → {tl_end}")
          print(f"Ventana TrackGTS (semana previa, red de seguridad): {tl_start_prev} → {tl_end_prev}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"start={start_str}\n")
              f.write(f"end={end_str}\n")
              f.write(f"tl_start={tl_start}\n")
              f.write(f"tl_end={tl_end}\n")
              f.write(f"tl_start_prev={tl_start_prev}\n")
              f.write(f"tl_end_prev={tl_end_prev}\n")
          EOF
        env:
          INPUT_OVERRIDE_START: ${{ github.event.inputs.override_start }}
          INPUT_OVERRIDE_END:   ${{ github.event.inputs.override_end }}

      # ── Node.js ──────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Node
        run: npm install puppeteer adm-zip xlsx
        timeout-minutes: 5

      # ── Descargar datos de TrackGTS (dos ventanas de 7 días separadas: ───────
      #    semana previa como red de seguridad + semana objetivo) ─────────────
      - name: Descargar semana previa (red de seguridad)
        env:
          TL_USER:     ${{ secrets.TL_USER }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_DOMAIN:   ${{ secrets.TL_DOMAIN }}
          TL_START:    ${{ steps.dates.outputs.tl_start_prev }}
          TL_END:      ${{ steps.dates.outputs.tl_end_prev }}
        run: node download-weekly.js && mv latest.xlsx bulk_0.xlsx
        timeout-minutes: 8

      - name: Descargar semana objetivo
        env:
          TL_USER:     ${{ secrets.TL_USER }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_DOMAIN:   ${{ secrets.TL_DOMAIN }}
          TL_START:    ${{ steps.dates.outputs.tl_start }}
          TL_END:      ${{ steps.dates.outputs.tl_end }}
        run: node download-weekly.js && mv latest.xlsx bulk_1.xlsx
        timeout-minutes: 8

      # ── Fusionar con historial ───────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: pip install openpyxl

      - name: Fusionar con historial
        run: python3 merge_history.py

      # ── Generar PDF ─────────────────────────────────────────────────────────
      - name: Generar PDF del reporte
        env:
          REPORT_START: ${{ steps.dates.outputs.start }}
          REPORT_END:   ${{ steps.dates.outputs.end }}
        run: node generate-pdf.js
        timeout-minutes: 5

      # ── Commit Excel + PDF ──────────────────────────────────────────────────
      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "INFORME EXCESOS DE VELOCIDAD.xlsx" "reporte-semanal.pdf"
          git diff --staged --quiet \
            && echo "Sin cambios — nada que commitear." \
            || git commit -m "auto: reporte semana ${{ steps.dates.outputs.start }} → ${{ steps.dates.outputs.end }}"
          git push
